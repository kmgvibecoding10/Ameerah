<title>Emerald Tours — нетипичные туры для соло-путешественниц</title>
<meta name="description" content="Emerald Tours: готовые нетипичные туры для женщин-путешественниц — Турция, Корея, Армения, Азербайджан.">
<link rel="canonical" href="https://emeraldtours.kz/">
<meta property="og:title" content="Emerald Tours">
<meta property="og:description" content="Нетипичные туры для соло-путешественниц: Турция, Корея, Армения, Азербайджан">
<meta property="og:image" content="https://emeraldtours.kz/images/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--cream:#faf6ee;--paper:#fffdf8;--sage:#6f8f72;--forest:#1f4a3a;--emerald:#0f7a5a;--moss:#a9bfa0;--clay:#c9805a;--sand:#efe6d3;--ink:#2b3a30;--muted:#66756a;--line:#e2d9c4;--radius:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.65;font-size:17px}
img{display:block;width:100%;height:100%;object-fit:cover}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.15;color:var(--forest)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
.eyebrow{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);margin-bottom:10px}
.lead{color:var(--muted);max-width:640px;font-size:1.08rem}
.section-head{margin-bottom:36px}
.section-head h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:12px}

nav{position:sticky;top:0;z-index:20;background:rgba(250,246,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.logo{font-family:'Fraunces',serif;font-weight:700;color:var(--forest);text-decoration:none;font-size:1.25rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{width:14px;height:14px;background:var(--emerald);transform:rotate(45deg);border-radius:3px;display:inline-block}
.logo span{color:var(--emerald)}
.links{display:flex;gap:18px;font-weight:600;font-size:.93rem}
.links a{text-decoration:none;color:var(--muted);white-space:nowrap}
.links a:hover{color:var(--forest)}
.lang{display:flex;gap:4px;background:var(--sand);padding:3px;border-radius:999px}
.lang button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.82rem;padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--emerald);color:#fff}

.hero{position:relative;min-height:90vh;display:flex;align-items:flex-end;color:#fff;padding:0}
.hero .bg{position:absolute;inset:0}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,50,38,.25),rgba(15,50,38,.82))}
.hero .wrap{position:relative;padding:120px 20px 64px}
.hero h1{color:#fff;font-size:clamp(2.3rem,6vw,4.4rem);max-width:780px}
.hero p{max-width:560px;margin:18px 0 28px;font-size:1.15rem;color:#eef3e8}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:700;text-decoration:none;transition:.2s}
.btn-primary{background:var(--clay);color:#fff}
.btn-primary:hover{background:#b56e49}
.btn-ghost{border:2px solid rgba(255,255,255,.75);color:#fff;margin-left:10px}
.btn-ghost:hover{background:rgba(255,255,255,.15)}

.welcome{background:var(--paper)}
.welcome-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.welcome h2{font-size:clamp(1.8rem,3.5vw,2.6rem);margin-bottom:16px}
.welcome p+p{margin-top:14px}
.how{margin-top:24px;font-size:.95rem;color:var(--muted)}
.principles{display:grid;gap:14px}
.principle{display:flex;gap:14px;background:var(--sand);padding:16px 18px;border-radius:16px}
.principle b{display:block;color:var(--forest)}
.principle .ic{font-size:1.5rem;line-height:1}

.countries{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.country{position:relative;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;text-decoration:none;color:#fff;display:flex;align-items:flex-end;box-shadow:0 10px 30px rgba(31,74,58,.14)}
.country img{position:absolute;inset:0;transition:transform .5s}
.country:hover img{transform:scale(1.06)}
.country::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(12,38,28,.9))}
.country div{position:relative;z-index:1;padding:20px}
.country h3{color:#fff;font-size:1.45rem}
.country small{display:block;opacity:.92;font-size:.9rem}
.country .dur{display:inline-block;margin-top:8px;background:var(--emerald);padding:2px 12px;border-radius:999px;font-size:.78rem;font-weight:700}

.route{padding:64px 0;border-top:1px solid var(--line)}
.route.alt{background:var(--paper)}
.route-head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:28px}
.route-head h2{font-size:clamp(1.9rem,4.2vw,3rem)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.facts span{background:var(--sand);padding:6px 14px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--forest)}
.facts span.price{background:var(--emerald);color:#fff}
.photos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:340px}
.photos figure{border-radius:18px;overflow:hidden;position:relative}
.photos figure:first-child{grid-row:1/3}
.photos figcaption{position:absolute;left:10px;bottom:8px;font-size:.78rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.days{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.day{flex:1 1 160px;background:var(--sand);border-radius:16px;padding:14px 16px;font-size:.92rem}
.day b{display:block;color:var(--clay);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.route.alt .card{background:var(--cream)}
.card h4{font-family:'Fraunces',serif;font-size:1.12rem;color:var(--forest);margin-bottom:10px}
.card ul{list-style:none}
.card li{padding:7px 0 7px 18px;position:relative;font-size:.95rem;border-bottom:1px dashed var(--line)}
.card li:last-child{border:0}
.card li::before{content:"";position:absolute;left:0;top:15px;width:7px;height:7px;border-radius:50%;background:var(--sage)}
.card.hidden{background:var(--forest)!important;border-color:var(--forest);color:#eef3ea}
.card.hidden h4{color:#f2d9c5}
.card.hidden li{border-color:rgba(255,255,255,.18)}
.card.hidden li::before{background:var(--clay)}
.sub{margin:40px 0 18px;font-size:1.6rem}
.sub:first-of-type{margin-top:0}
.btn-tour{margin-top:26px;background:var(--emerald);color:#fff}
.btn-tour:hover{background:var(--forest)}

.stays{background:linear-gradient(180deg,#e9f1e4,#f3f7ef)}
.stay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.stay{background:#fff;border-radius:var(--radius);padding:22px;border:1px solid #d6e3cf}
.stay .city{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--emerald)}
.stay h4{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--forest);margin:4px 0 8px}
.stay p{font-size:.94rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{background:#e3efdd;color:var(--forest);font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px}

.halal-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:36px;align-items:start}
.halal-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.halal-photos figure{border-radius:18px;overflow:hidden;aspect-ratio:1/1;position:relative}
.halal-photos figure:first-child{grid-column:1/3;aspect-ratio:16/9}
.halal-photos figcaption{position:absolute;left:10px;bottom:8px;font-size:.78rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.halal-list{display:grid;gap:12px}
.halal-item{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.halal-item b{color:var(--forest)}
.halal-item span{display:block;color:var(--muted);font-size:.94rem}

.reviews{background:var(--sand)}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rev{background:var(--paper);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:12px}
.stars{color:#e0a43a;letter-spacing:2px}
.rev p{font-size:.96rem}
.rev footer{margin-top:auto;font-size:.85rem;color:var(--muted)}
.rev footer b{color:var(--forest);display:block}

.safety{background:var(--forest);color:#eaf0e5}
.safety h2{color:#fff;margin-bottom:28px;font-size:clamp(1.8rem,3.5vw,2.5rem)}
.safety-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.safety-grid div{background:rgba(255,255,255,.08);border-radius:18px;padding:20px}
.safety-grid b{display:block;color:#f2d9c5;margin-bottom:6px}

.contacts{text-align:center;background:var(--paper)}
.contacts h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:12px}
.contacts .lead{margin:0 auto 30px}
.contact-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.contact-row a{padding:16px 30px;border-radius:999px;text-decoration:none;font-weight:700;color:#fff;transition:.2s}
.c-wa{background:#1f9d62}.c-ig{background:linear-gradient(45deg,#e0803a,#c9306a,#7b3fb8)}
.contact-row a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.pk-wrap{margin-top:40px}
.pk-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.pk{background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column}
.route.alt .pk{background:var(--cream)}
.pk.pro{border-color:var(--emerald);background:linear-gradient(180deg,#eaf5ee,var(--paper))}
.pk h4{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--forest)}
.pk .pr{font-size:1.7rem;font-weight:700;color:var(--emerald);margin:4px 0 12px}
.pk .pr small{font-size:.8rem;font-weight:600;color:var(--muted)}
.pk ul{list-style:none;margin-bottom:18px}
.pk li{padding:5px 0 5px 24px;position:relative;font-size:.94rem}
.pk li::before{content:"✓";position:absolute;left:0;color:var(--emerald);font-weight:700}
.pk .btn{margin-top:auto;text-align:center;border:0;cursor:pointer;font:inherit;font-weight:700;background:var(--emerald);color:#fff}
.pk:not(.pro) .btn{background:var(--forest)}
.dates{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.dates b{font-size:.9rem;color:var(--forest)}
.dates button{border:1px solid var(--moss);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:.88rem;font-weight:700;color:var(--forest);cursor:pointer}
.dates button:hover{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.pknote{font-size:.82rem;color:var(--muted);margin-top:10px}
.form{max-width:640px;margin:0 auto 34px;background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:28px;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--forest)}
.form .full{grid-column:1/3}
.form input,.form select,.form textarea{font:inherit;font-weight:400;font-size:1rem;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--emerald);border-color:transparent}
.form button{grid-column:1/3;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:1.05rem;padding:15px;border-radius:999px;background:#1f9d62;color:#fff}
.form button:hover{background:var(--forest)}
.fnote{grid-column:1/3;font-size:.82rem;color:var(--muted);text-align:center}
.or{margin:0 0 16px;color:var(--muted);font-size:.9rem}
@media(max-width:700px){.pk-grid,.form{grid-template-columns:1fr}.form .full,.form button,.fnote{grid-column:1}}
footer.foot{padding:28px 0;text-align:center;font-size:.85rem;color:var(--muted)}
footer.foot a{color:var(--clay)}

@media(max-width:900px){
 .welcome-grid,.route-head,.halal-grid{grid-template-columns:1fr}
 .countries{grid-template-columns:repeat(2,1fr)}
 .rev-grid{grid-template-columns:1fr 1fr}
 .links{display:none}
 .photos{height:280px}
 section{padding:56px 0}
}
@media(max-width:560px){
 .rev-grid{grid-template-columns:1fr}
 .btn-ghost{margin:10px 0 0}
 .photos{grid-template-columns:1fr 1fr;grid-template-rows:200px 120px;height:auto}
 .photos figure:first-child{grid-column:1/3;grid-row:1}
 .logo{font-size:1.05rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ---------- Рендер ---------- */
const $ = s => document.querySelector(s);

const img = (f,alt,lazy=true)=>`<img src="images/${f}.jpg" alt="${alt}" ${lazy?'loading="lazy"':''}>`;

const fmtPrice = n => new Intl.NumberFormat("ru-RU").format(n).replace(/ /g," ");
const fmtDate = (d,loc) => new Date(d+"T12:00:00").toLocaleDateString(loc,{day:"numeric",month:"long",year:"numeric"});
let selected = {tour:"", pkg:"simple", date:""};

  const tourHTML = TOURS.map((o,i)=>{
    const x = t.tours[o.id];
    return `<section class="route ${i%2?'alt':''}" id="${o.id}"><div class="wrap">

       <span class="eyebrow">${o.flag} ${x.sub}</span><h2>${x.name}</h2>

       <div class="card"><h4>${t.labelCafe}</h4><ul>${li(x.cafe)}</ul></div>
       <div class="card hidden"><h4>${t.labelHidden}</h4><ul>${li(x.hidden)}</ul></div>
     </div>
     <div class="pk-wrap"><h3 class="sub" style="margin:0">${xx.pkgH}</h3>
      <div class="pk-grid">
       ${["simple","pro"].map(k=>`<div class="pk ${k}"><h4>${xx[k]}</h4><div class="pr">${fmtPrice(o[k])} ₸ <small>${xx.per}</small></div>
        <ul>${li(xx[k+"Inc"])}</ul><button class="btn" data-pick="${o.id}" data-pkg="${k}">${xx.pick}</button></div>`).join("")}
      </div>
      <div class="dates"><b>${xx.dates}</b>${o.dates.map(d=>`<button data-pick="${o.id}" data-date="${d}">${fmtDate(d,xx.loc)}</button>`).join("")}</div>

    <span class="eyebrow" style="color:#f2d9c5">${t.heroTag}</span><h1>${t.heroH}</h1><p>${t.heroP}</p>
    <a class="btn btn-primary" href="#tours">${t.heroB1}</a><a class="btn btn-ghost" href="${WA}">${t.heroB2}</a></div></header>

  <section class="welcome" id="welcome"><div class="wrap welcome-grid"><div>
    <span class="eyebrow">${t.wTag}</span><h2>${t.wH}</h2><p>${t.wP1}</p><p>${t.wP2}</p><p class="how">${t.how}</p></div>
    <div class="principles">${t.pr.map(p=>`<div class="principle"><span class="ic">${p[0]}</span><div><b>${p[1]}</b>${p[2]}</div></div>`).join("")}</div></div></section>

   <div class="countries">${TOURS.map(o=>`<a class="country" href="#${o.id}">${img(o.card,t.tours[o.id].name)}<div><h3>${o.flag} ${t.tours[o.id].name.split(":")[0].split(",")[0]}</h3><small>${t.tours[o.id].sub}</small><span class="dur">${o.d} ${t.days}</span></div></a>`).join("")}</div></div></section>

   <div class="stay-grid">${t.stays.map(s=>`<div class="stay"><span class="city">${s[0]}</span><h4>${s[1]}</h4><p>${s[2]}</p><div class="chips">${s[3].map(c=>`<span>${c}</span>`).join("")}</div></div>`).join("")}</div></div></section>

  <section class="contacts" id="contacts"><div class="wrap"><span class="eyebrow">${t.kTag}</span><h2>${t.kH}</h2><p class="lead">${t.kP}</p>

   <form class="form" id="form">

    <label>${xx.fContact}<input name="contact" required placeholder="+7… / @instagram"></label>

    <label>${xx.fPkg}<select name="pkg" id="f-pkg"><option value="simple">${xx.simple}</option><option value="pro">${xx.pro}</option></select></label>
    <label>${xx.fDate}<select name="date" id="f-date"></select></label>
    <label>${xx.fPeople}<input name="people" type="number" min="1" max="10" value="1"></label>
    <label class="full">${xx.fComment}<textarea name="comment" rows="3"></textarea></label>
    <button type="submit">💬 ${xx.fSend}</button><p class="fnote">${xx.fNote}</p>
   </form>
   <div class="contact-row"><a class="c-wa" href="${WA}">💬 WhatsApp</a><a class="c-ig" href="${IG}">📷 Instagram</a></div></div></section>

  <footer class="foot"><div class="wrap">${t.foot}<br>emeraldtours.kz</div></footer>`;
  bindForm(lang);
}

function bindForm(lang){
  const xx = X[lang], t = L[lang];
  const fT=$("#f-tour"), fP=$("#f-pkg"), fD=$("#f-date");
  const fillDates = () => {
    const o = TOURS.find(x=>x.id===fT.value);
    fD.innerHTML = `<option value="">${xx.fAny}</option>` + o.dates.map(d=>`<option value="${d}">${fmtDate(d,xx.loc)}</option>`).join("");
  };
  fT.value = selected.tour || TOURS[0].id; fillDates();
  fP.value = selected.pkg; fD.value = selected.date;
  fT.onchange = () => { selected.tour = fT.value; selected.date = ""; fillDates(); };
  fP.onchange = () => selected.pkg = fP.value;
  fD.onchange = () => selected.date = fD.value;
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    selected.tour = b.dataset.pick;
    if(b.dataset.pkg) selected.pkg = b.dataset.pkg;
    if(b.dataset.date) selected.date = b.dataset.date; else if(!b.dataset.date) selected.date = "";
    fT.value = selected.tour; fillDates(); fP.value = selected.pkg; fD.value = selected.date;
    $("#form").scrollIntoView({behavior:"smooth",block:"center"});
  });
  $("#form").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), o = TOURS.find(x=>x.id===f.get("tour"));
    const text = xx.msg({name:f.get("name"), contact:f.get("contact"), tour:t.tours[o.id].name,
      pkg: xx[f.get("pkg")] + " — " + fmtPrice(o[f.get("pkg")]) + " ₸",
      date: f.get("date") ? fmtDate(f.get("date"),xx.loc) : xx.fAny, people:f.get("people"), comment:f.get("comment")});
    window.open(WA + "?text=" + encodeURIComponent(text), "_blank", "noopener");
  };
}

let lang = "ru";
try{ lang = localStorage.getItem("lang") || ((navigator.language||"").startsWith("kk")?"kk":(navigator.language||"").startsWith("en")?"en":"ru"); }catch(e){}
document.getElementById("lang").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; try{localStorage.setItem("lang",lang)}catch(e){} render(lang);
});
render(lang);
